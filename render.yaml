# Render Blueprint for InvoiceGuard: the API, one background worker, and Redis.
# Postgres is on Neon (AWS us-east-2), so every service runs in Render's Ohio region next to
# it. Render prompts once for each `sync: false` value; see docs/deploy.md before applying.
services:
  - type: web
    name: invoiceguard-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./deploy/Dockerfile.backend
    dockerContext: .
    # Single instance in Release 1, so migrating at start-up is safe. With several
    # instances, move this to a paid pre-deploy command instead.
    dockerCommand: sh -c "alembic upgrade head && uvicorn invoiceguard.api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /health
    envVars:
      # Neon: DATABASE_URL is the pooled URL (app traffic); DATABASE_URL_UNPOOLED is the
      # direct URL that `alembic upgrade head` uses at start-up.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: invoiceguard-redis
          property: connectionString
      - key: API_KEYS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EXTRACTION_MODE
        value: replay
      - key: EXTRACTION_PROVIDER
        value: groq
      - key: EXTRACTION_MODEL
        value: openai/gpt-oss-20b
      - key: WRITES_ENABLED
        value: "true"
      - key: RATE_LIMIT_WRITES_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_UPLOADS_PER_MINUTE
        value: "5"

  # Workers have no free plan on Render. To keep the demo to one paid instance, this
  # container runs the outbox dispatcher alongside the Celery worker. Trade-off: if the
  # dispatcher process dies, nothing restarts it until the container restarts.
  - type: worker
    name: invoiceguard-worker
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./deploy/Dockerfile.backend
    dockerContext: .
    dockerCommand: sh -c "python -m invoiceguard.jobs.dispatcher & exec celery -A invoiceguard.jobs.celery_app worker --loglevel=info --concurrency=2"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: invoiceguard-redis
          property: connectionString
      - key: EXTRACTION_MODE
        value: replay
      - key: EXTRACTION_PROVIDER
        value: groq
      - key: EXTRACTION_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false

  # Queue for the worker. An empty allow list means only Render services on the private
  # network can reach it; nothing is exposed to the internet. The outbox in Postgres is the
  # durable record, so losing queued messages on a restart loses no work.
  - type: keyvalue
    name: invoiceguard-redis
    plan: free
    region: ohio
    maxmemoryPolicy: noeviction
    ipAllowList: []
