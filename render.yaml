# Render Blueprint for InvoiceGuard: everything on free plans, no payment card needed.
# Postgres is on Neon (AWS us-east-2), so the service runs in Render's Ohio region next to
# it. Render prompts once for each `sync: false` value; see docs/deploy.md before applying.
#
# Render has no free plan for background workers, so the free web service runs the API,
# the Celery worker and the outbox dispatcher in one container. A free web service sleeps
# when idle; uploads made meanwhile wait in the Postgres outbox and are processed when it
# wakes. To move the worker to its own (paid) service later, see docs/deploy.md.
services:
  - type: web
    name: invoiceguard-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./deploy/Dockerfile.backend
    dockerContext: .
    # No dockerCommand: the image's default command (deploy/start.sh) migrates, then runs the
    # dispatcher, the Celery worker (solo pool, one process) and the API. Single instance, so
    # migrating at start-up is safe.
    healthCheckPath: /health
    envVars:
      # Neon: DATABASE_URL is the pooled URL (app traffic); DATABASE_URL_UNPOOLED is the
      # direct URL that `alembic upgrade head` uses at start-up.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Redis from Upstash (free, no card): paste its rediss:// URL when prompted. Render
      # allows only one free Key Value instance per account, so it is not created here.
      - key: REDIS_URL
        sync: false
      - key: API_KEYS
        sync: false
      # Reviewer names (from API_KEYS) allowed to issue and disable agent keys.
      - key: ADMIN_USERS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EXTRACTION_MODE
        value: replay
      - key: EXTRACTION_PROVIDER
        value: groq
      - key: EXTRACTION_MODEL
        value: openai/gpt-oss-20b
      - key: WRITES_ENABLED
        value: "true"
      - key: RATE_LIMIT_WRITES_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_UPLOADS_PER_MINUTE
        value: "5"
      - key: GROQ_API_KEY
        sync: false
