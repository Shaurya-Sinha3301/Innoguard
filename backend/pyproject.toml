[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoiceguard"
version = "0.1.0"
description = "Approval-gated invoice reconciliation with three-way matching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# These are frozen dataclasses, so using them as argument defaults is safe.
extend-immutable-calls = [
    "invoiceguard.domain.models.Tolerances",
    "invoiceguard.domain.policy.PolicyConfig",
    "invoiceguard.domain.decision.Thresholds",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
]
