# Render Blueprint for InvoiceGuard: everything on free plans, no payment card needed.
# Postgres is on Neon (AWS us-east-2), so the services run in Render's Ohio region next to
# it. Render prompts once for each `sync: false` value; see docs/deploy.md before applying.
#
# Render has no free plan for background workers, so the free web service runs the API,
# the Celery worker and the outbox dispatcher in one container. A free web service sleeps
# when idle; uploads made meanwhile wait in the Postgres outbox and are processed when it
# wakes. To move the worker to its own (paid) service later, see docs/deploy.md.
services:
  - type: web
    name: invoiceguard-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./deploy/Dockerfile.backend
    dockerContext: .
    # Single instance, so migrating at start-up is safe. The solo pool keeps the worker to
    # one process to fit the free plan's memory.
    dockerCommand: >-
      sh -c "alembic upgrade head
      && (python -m invoiceguard.jobs.dispatcher &)
      && (celery -A invoiceguard.jobs.celery_app worker --pool=solo --loglevel=info &)
      && exec uvicorn invoiceguard.api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /health
    envVars:
      # Neon: DATABASE_URL is the pooled URL (app traffic); DATABASE_URL_UNPOOLED is the
      # direct URL that `alembic upgrade head` uses at start-up.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: invoiceguard-redis
          property: connectionString
      - key: API_KEYS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EXTRACTION_MODE
        value: replay
      - key: EXTRACTION_PROVIDER
        value: groq
      - key: EXTRACTION_MODEL
        value: openai/gpt-oss-20b
      - key: WRITES_ENABLED
        value: "true"
      - key: RATE_LIMIT_WRITES_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_UPLOADS_PER_MINUTE
        value: "5"
      - key: GROQ_API_KEY
        sync: false

  # Queue for the worker. An empty allow list means only Render services on the private
  # network can reach it; nothing is exposed to the internet. The outbox in Postgres is the
  # durable record, so losing queued messages on a restart loses no work.
  - type: keyvalue
    name: invoiceguard-redis
    plan: free
    region: ohio
    maxmemoryPolicy: noeviction
    ipAllowList: []
