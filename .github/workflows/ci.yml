name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoiceguard
          POSTGRES_PASSWORD: invoiceguard
          POSTGRES_DB: invoiceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceguard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://invoiceguard:invoiceguard@localhost:5432/invoiceguard
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Tests (unit, real Postgres integration, concurrency)
        run: pytest -q
      - name: Migrations apply cleanly
        run: alembic upgrade head

  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - name: Decision rules on the locked set (oracle extraction)
        run: python -m invoiceguard.evaluation.runner --extractor oracle --gate
      - name: Controls under simulated extraction errors
        run: python -m invoiceguard.evaluation.runner --extractor noisy --gate
      - name: Recorded model runs, if any are committed
        run: |
          for dir in ../eval/recordings/*/; do
            [ -d "$dir" ] || continue
            python -m invoiceguard.evaluation.runner --extractor replay --model "$(basename "$dir")" --gate
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: eval/reports/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.backend -t invoiceguard-backend .
